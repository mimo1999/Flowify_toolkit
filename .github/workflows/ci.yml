name: CI

# Runs the parts of the test suite that don't need a live server, plus a
# frontend build and a Docker build, on every push/PR. tests/test_integration.py
# is intentionally excluded — it requires `uvicorn` already running on :8000
# (see tests/requirements.txt and the project README's test instructions).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements.txt
      - run: pip install -r backend/requirements.txt -r tests/requirements.txt
      - name: Run tests that don't require a live server
        # from the project root, not tests/ — relative imports break otherwise
        run: pytest tests/ -v --ignore=tests/test_integration.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed — just catches breakage early)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
