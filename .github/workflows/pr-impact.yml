name: PR impact

# Comments on each PR with the functions it changes and what depends on them.
# Drop this file (and backend/) into a repo, or run Flowify's action from a checkout of it.

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Build report
        run: python backend/app/pr_impact.py --repo . --base "origin/${{ github.base_ref }}" > comment.md
      - name: Post (update in place)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body-file comment.md
